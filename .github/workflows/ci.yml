name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # plain: pgvector only, keyword search falls back to ts_rank_cd.
        # bm25: the deployed image (postgres/Dockerfile) with pg_textsearch.
        postgres: [plain, bm25]
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/strata_test
      REQUIRE_TEST_DB: "1"  # integration tests fail instead of skipping
      REQUIRE_BM25: ${{ matrix.postgres == 'bm25' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (${{ matrix.postgres }})
        working-directory: .
        run: |
          if [ "${{ matrix.postgres }}" = bm25 ]; then
            docker build -t strata-postgres ./postgres
            image=strata-postgres
          else
            image=pgvector/pgvector:pg17
          fi
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=strata_test "$image"
          for _ in $(seq 60); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
