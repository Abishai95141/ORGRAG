name: strata

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/strata
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  SECRETS_ENCRYPTION_KEYS: ${SECRETS_ENCRYPTION_KEYS:-}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_FALLBACKS: ${LLM_FALLBACKS:-default}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  RERANK_PROVIDER: ${RERANK_PROVIDER:-auto}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  EXPLABS_API_KEY: ${EXPLABS_API_KEY:-}
  GRAPH_EXTRACTION_MODEL: ${GRAPH_EXTRACTION_MODEL:-}
  GRAPH_EXTRACTION_FALLBACK_MODEL: ${GRAPH_EXTRACTION_FALLBACK_MODEL:-}
  NVIDIA_MAX_CONCURRENCY: ${NVIDIA_MAX_CONCURRENCY:-4}
  FILE_STORAGE_DIR: /data/files
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CHAT_RUN_TIMEOUT_SECONDS: ${CHAT_RUN_TIMEOUT_SECONDS:-900}
  CORS_ORIGINS: '["http://localhost:3000"]'
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  TRACE_CONTENT: ${TRACE_CONTENT:-false}
  # The models baked into the image, unless .env names others (an empty value would
  # make Docling download them on first use).
  DOCLING_ARTIFACTS_PATH: ${DOCLING_ARTIFACTS_PATH:-/opt/docling-models}

services:
  db:
    # Postgres 17 + pgvector + pg_textsearch (BM25). Upgrading from the old pg16 volume:
    # see README "Upgrading to Postgres 17".
    build: ./postgres
    environment:
      POSTGRES_DB: strata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strata"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Loopback only: reachable for host development (`make dev-db`), not from the network.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  api:
    build: ./backend
    # Every setting in .env reaches the app (VISION_PARSING, SCAN_TOOL, …); the
    # entries under `environment` win where both set one.
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8000:8000"  # the web app proxies /api; expose it deliberately if needed

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - files:/data/files
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  files:
